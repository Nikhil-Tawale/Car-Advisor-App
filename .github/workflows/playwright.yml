name: Playwright End-to-end Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # ----- Build frontend first (creates frontend/dist) -----
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Setup Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # ----- Backend setup (now frontend/dist exists) -----
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Start backend (background, log to file)
        working-directory: ./backend
        run: |
          nohup npm run start > backend.log 2>&1 &
          sleep 2
          echo "Backend process started"

      - name: Wait for backend (root endpoint)
        run: |
          npx wait-on http://localhost:5001 --timeout 60000 --verbose
          echo "Backend is ready"

      - name: Verify backend is accessible
        run: |
          curl -v http://localhost:5001/ || echo "Initial check failed, waiting..."
          sleep 2

      - name: Show backend logs on failure
        if: failure()
        working-directory: ./backend
        run: cat backend.log || true

      # ----- Frontend preview server for Playwright -----
      - name: Start frontend preview server
        working-directory: ./frontend
        run: |
          nohup npx serve dist --listen 5175 > frontend.log 2>&1 &
          sleep 3
          echo "Frontend preview server started"

      - name: Wait for frontend preview server
        run: |
          npx wait-on http://localhost:5175 --timeout 180000 --verbose
          echo "Frontend is ready"

      # ----- Playwright tests -----
      - name: Run Playwright tests
        working-directory: ./frontend
        run: npx playwright test 

      # ----- Upload artifacts (always) -----
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload backend logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-log
          path: backend/backend.log
          retention-days: 7

      - name: Upload frontend logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-log
          path: frontend/frontend.log
          retention-days: 7