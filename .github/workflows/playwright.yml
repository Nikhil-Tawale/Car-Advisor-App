name: Playwright End-to-end Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'


      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build backend (if applicable)
        working-directory: ./backend
        run: npm run build || true

      - name: Start backend (background, log to file)
        working-directory: ./backend
        run: |
          nohup npm run start > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend
        run: npx wait-on http://localhost:5001 --timeout 180000

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build app
        working-directory: ./frontend
        run: npm run build

      - name: Start preview server
        working-directory: ./frontend
        run: npm run preview -- --port 5173 &

      - name: Wait for frontend
        run: npx wait-on http://localhost:5173 --timeout 180000

      - name: Show backend logs on failure
        if: failure()
        working-directory: ./backend
        run: cat backend.log || true

      - name: Setup Playwright
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: ./frontend
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload backend logs
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: backend-log
          path: backend/backend.log
          retention-days: 7
